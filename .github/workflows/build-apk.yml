name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - - name: Unzip project
  run: unzip -o path/to/YourActualName.zip -d project
          

      - name: Set backend URL (optional)
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          if [ -n "$BACKEND_URL" ]; then
            sed -i "s|fetch(\"/api/v1/chat/completions\"|fetch(\"$BACKEND_URL/api/v1/chat/completions\"|" project/app/src/main/assets/index.html
            echo "Backend URL set to $BACKEND_URL"
          else
            echo "BACKEND_URL not set, skipping"
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: project
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DhankAI-APK
          path: project/app/build/outputs/apk/debug/*.apk
