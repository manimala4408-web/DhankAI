name: Build Dhank AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle executable
        run: chmod +x gradlew
        working-directory: ./android   # <--- Unga subfolder name (eg: android)

      - name: Build APK
        run: ./gradlew assembleDebug
        working-directory: ./android   # <--- Unga subfolder name

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dhank-AI-APK
          path: android/app/build/outputs/apk/debug/*.apk
