<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DhankAI</title>

  <meta
    name="description"
    content="DhankAI - Your intelligent AI assistant"
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #080b12;
      --panel: #10151f;
      --panel2: #151c28;
      --border: #263142;
      --text: #f5f7fb;
      --muted: #8e99aa;
      --accent: #63e6be;
      --accent2: #4dabf7;
      --user: #1d5d4e;
      --bot: #161d29;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* APP */

    .app {
      width: 100%;
      max-width: 1000px;
      height: 100vh;
      margin: auto;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    /* HEADER */

    header {
      height: 72px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: rgba(8, 11, 18, 0.95);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: bold;
      background: linear-gradient(
        135deg,
        var(--accent),
        var(--accent2)
      );
      color: #07100e;
      box-shadow: 0 0 25px rgba(99, 230, 190, 0.18);
    }

    .brand-text h1 {
      font-size: 20px;
    }

    .brand-text p {
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
    }

    .clear-btn {
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      transition: 0.2s;
    }

    .clear-btn:hover {
      border-color: var(--accent);
    }

    /* CHAT */

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px 18px 130px;
      scroll-behavior: smooth;
    }

    .welcome {
      text-align: center;
      max-width: 650px;
      margin: 70px auto 40px;
    }

    .welcome-icon {
      font-size: 55px;
      margin-bottom: 18px;
    }

    .welcome h2 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .welcome p {
      color: var(--muted);
      line-height: 1.6;
    }

    .suggestions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 28px;
    }

    .suggestion {
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      border-radius: 14px;
      padding: 16px;
      text-align: left;
      cursor: pointer;
      transition: 0.2s;
    }

    .suggestion:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    /* MESSAGE */

    .message {
      display: flex;
      gap: 12px;
      max-width: 800px;
      margin: 0 auto 20px;
    }

    .message.user {
      justify-content: flex-end;
    }

    .avatar {
      width: 36px;
      height: 36px;
      flex: 0 0 36px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--panel2);
      border: 1px solid var(--border);
    }

    .message.user .avatar {
      order: 2;
      background: var(--user);
    }

    .bubble {
      max-width: 75%;
      padding: 13px 16px;
      border-radius: 16px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.bot .bubble {
      background: var(--bot);
      border: 1px solid var(--border);
      border-top-left-radius: 5px;
    }

    .message.user .bubble {
      background: var(--user);
      border-top-right-radius: 5px;
    }

    /* TYPING */

    .typing {
      display: flex;
      gap: 5px;
      align-items: center;
      height: 20px;
    }

    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
      animation: bounce 1s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes bounce {
      0%, 60%, 100% {
        transform: translateY(0);
      }

      30% {
        transform: translateY(-5px);
      }
    }

    /* INPUT */

    .input-area {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(1000px, 100%);
      padding: 15px 18px 20px;
      background: linear-gradient(
        transparent,
        var(--bg) 25%
      );
    }

    .input-box {
      max-width: 800px;
      margin: auto;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      padding: 8px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 -5px 30px rgba(0, 0, 0, 0.25);
    }

    textarea {
      flex: 1;
      resize: none;
      min-height: 45px;
      max-height: 130px;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
      padding: 12px;
      font-family: inherit;
      font-size: 15px;
    }

    textarea::placeholder {
      color: var(--muted);
    }

    .send-btn {
      width: 45px;
      height: 45px;
      border: none;
      border-radius: 13px;
      background: var(--accent);
      color: #06110d;
      font-size: 20px;
      cursor: pointer;
      transition: 0.2s;
    }

    .send-btn:hover {
      transform: scale(1.04);
    }

    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .footer-note {
      text-align: center;
      color: var(--muted);
      font-size: 10px;
      margin-top: 7px;
    }

    /* MOBILE */

    @media (max-width: 600px) {

      header {
        height: 64px;
        padding: 0 13px;
      }

      .logo {
        width: 39px;
        height: 39px;
        border-radius: 12px;
      }

      .brand-text h1 {
        font-size: 18px;
      }

      .clear-btn {
        padding: 8px 10px;
        font-size: 12px;
      }

      .chat {
        padding: 15px 12px 125px;
      }

      .welcome {
        margin: 55px auto 30px;
      }

      .welcome-icon {
        font-size: 45px;
      }

      .welcome h2 {
        font-size: 26px;
      }

      .suggestions {
        grid-template-columns: 1fr;
      }

      .bubble {
        max-width: 82%;
      }

      .input-area {
        padding: 10px 10px 15px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- HEADER -->

    <header>
      <div class="brand">

        <div class="logo">
          D
        </div>

        <div class="brand-text">
          <h1>DhankAI</h1>
          <p>Your intelligent assistant</p>
        </div>

      </div>

      <button class="clear-btn" onclick="clearChat()">
        🗑 Clear
      </button>
    </header>


    <!-- CHAT -->

    <main class="chat" id="chat">

      <section class="welcome" id="welcome">

        <div class="welcome-icon">
          🤖
        </div>

        <h2>Welcome to DhankAI</h2>

        <p>
          Ask me a question, brainstorm an idea,
          learn something new, or just start a conversation.
        </p>

        <div class="suggestions">

          <button
            class="suggestion"
            onclick="useSuggestion('Explain artificial intelligence simply')"
          >
            🧠 Explain AI simply
          </button>

          <button
            class="suggestion"
            onclick="useSuggestion('Give me some creative ideas')"
          >
            💡 Give me creative ideas
          </button>

          <button
            class="suggestion"
            onclick="useSuggestion('Help me learn something new')"
          >
            📚 Help me learn
          </button>

          <button
            class="suggestion"
            onclick="useSuggestion('Tell me something interesting')"
          >
            ✨ Tell me something interesting
          </button>

        </div>

      </section>

    </main>


    <!-- INPUT -->

    <div class="input-area">

      <div class="input-box">

        <textarea
          id="messageInput"
          placeholder="Message DhankAI..."
          rows="1"
          onkeydown="handleKey(event)"
        ></textarea>

        <button
          class="send-btn"
          id="sendBtn"
          onclick="sendMessage()"
        >
          ➤
        </button>

      </div>

      <div class="footer-note">
        DhankAI can make mistakes. Check important information.
      </div>

    </div>

  </div>


  <script>

    const chat = document.getElementById("chat");
    const input = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");

    let welcome = document.getElementById("welcome");


    /* SEND MESSAGE */

    function sendMessage() {

      const text = input.value.trim();

      if (!text) {
        return;
      }

      if (welcome) {
        welcome.remove();
        welcome = null;
      }

      addMessage(text, "user");

      input.value = "";
      input.style.height = "45px";

      sendBtn.disabled = true;

      showTyping();

      setTimeout(() => {

        removeTyping();

        const response = generateResponse(text);

        addMessage(response, "bot");

        sendBtn.disabled = false;

        input.focus();

      }, 900);
    }


    /* ADD MESSAGE */

    function addMessage(text, type) {

      const message = document.createElement("div");

      message.className = "message " + type;

      const avatar = document.createElement("div");

      avatar.className = "avatar";

      avatar.textContent =
        type === "bot" ? "🤖" : "👤";

      const bubble = document.createElement("div");

      bubble.className = "bubble";

      bubble.textContent = text;

      message.appendChild(avatar);
      message.appendChild(bubble);

      chat.appendChild(message);

      scrollToBottom();
    }


    /* TYPING */

    function showTyping() {

      const message = document.createElement("div");

      message.className = "message bot";
      message.id = "typingMessage";

      const avatar = document.createElement("div");

      avatar.className = "avatar";
      avatar.textContent = "🤖";

      const bubble = document.createElement("div");

      bubble.className = "bubble";

      bubble.innerHTML = `
        <div class="typing">
          <span></span>
          <span></span>
          <span></span>
        </div>
      `;

      message.appendChild(avatar);
      message.appendChild(bubble);

      chat.appendChild(message);

      scrollToBottom();
    }


    function removeTyping() {

      const typing =
        document.getElementById("typingMessage");

      if (typing) {
        typing.remove();
      }
    }


    /* DEMO AI RESPONSE */

    function generateResponse(message) {

      const text = message.toLowerCase();

      if (
        text.includes("hello") ||
        text.includes("hi") ||
        text.includes("hey")
      ) {

        return "Hello! 👋 I'm DhankAI. How can I help you today?";
      }


      if (text.includes("who are you")) {

        return "I'm DhankAI, a web-based AI assistant interface created for this project. 🤖";
      }


      if (
        text.includes("artificial intelligence") ||
        text === "explain ai simply"
      ) {

        return "Artificial Intelligence (AI) is technology that allows computers to perform tasks that normally require human-like abilities, such as understanding language, recognizing patterns, and solving problems.";
      }


      if (
        text.includes("interesting") ||
        text.includes("fun fact")
      ) {

        return "Here's a fun fact: 🐙 Octopuses have three hearts and blue blood. Two hearts help move blood through the gills, while the third circulates blood through the rest of the body.";
      }


      if (
        text.includes("creative") ||
        text.includes("ideas")
      ) {

        return "Here are a few ideas:\n\n1. 🚀 Build a personal AI assistant\n2. 🎮 Create a simple browser game\n3. 📚 Make a study planner\n4. 🌐 Build a portfolio website\n5. 🤖 Connect DhankAI to a real AI API";
      }


      if (
        text.includes("learn") ||
        text.includes("study")
      ) {

        return "A good way to learn something new is to break it into small steps:\n\n1. Understand the basics\n2. Practice with examples\n3. Build a small project\n4. Review your mistakes\n5. Repeat and improve 📚";
      }


      if (
        text.includes("thank")
      ) {

        return "You're welcome! 😊";
      }


      return "I received your message! 🤖\n\nThis current GitHub Pages version uses a demo response system. The next upgrade can connect DhankAI to a real AI backend so it can generate dynamic answers.";
    }


    /* SUGGESTIONS */

    function useSuggestion(text) {

      input.value = text;

      input.focus();

      sendMessage();
    }


    /* ENTER KEY */

    function handleKey(event) {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();
      }
    }


    /* AUTO RESIZE */

    input.addEventListener("input", function () {

      this.style.height = "auto";

      this.style.height =
        Math.min(this.scrollHeight, 130) + "px";
    });


    /* CLEAR */

    function clearChat() {

      chat.innerHTML = "";

      welcome = document.createElement("section");

      welcome.className = "welcome";
      welcome.id = "welcome";

      welcome.innerHTML = `
        <div class="welcome-icon">🤖</div>

        <h2>Welcome to DhankAI</h2>

        <p>
          Ask me a question, brainstorm an idea,
          learn something new, or just start a conversation.
        </p>

        <div class="suggestions">

          <button
            class="suggestion"
            onclick="useSuggestion('Explain artificial intelligence simply')"
          >
            🧠 Explain AI simply
          </button>

          <button
            class="suggestion"
            onclick="useSuggestion('Give me some creative ideas')"
          >
            💡 Give me creative ideas
          </button>

          <button
            class="suggestion"
            onclick="useSuggestion('Help me learn something new')"
          >
            📚 Help me learn
          </button>

          <button
            class="suggestion"
            onclick="useSuggestion('Tell me something interesting')"
          >
            ✨ Tell me something interesting
          </button>

        </div>
      `;

      chat.appendChild(welcome);

      input.focus();
    }


    /* SCROLL */

    function scrollToBottom() {

      setTimeout(() => {

        chat.scrollTop = chat.scrollHeight;

      }, 50);
    }

  </script>

</body>
</html>
